<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121010">
  <title>Little Havana · Paisajes sonoros</title>
  <link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
  <main class="pagina">
    <header class="muestra" id="muestra"></header>
    <h1 class="nombre">Paisajes sonoros</h1>
    <ul class="lista" id="lista"></ul>
  </main>
  <script src="assets/sitios.js"></script>
  <script>
    const M = window.MUESTRA;
    document.getElementById("muestra").innerHTML =
      `<strong>${M.titulo}</strong><br>${M.subtitulo}<br>${M.artista} · ${M.sede}`;
    document.getElementById("lista").innerHTML = Object.entries(window.SITIOS).map(([slug, s]) =>
      `<li><a href="${slug}/" style="--c:${s.color}"><span class="n">${s.numero}</span>` +
      `<span class="t">${s.nombre}</span><span class="l">${s.lugar}</span></a></li>`).join("");
  </script>
</body>
</html>
