<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaeaea">
  <title>Little Havana · Paisajes sonoros</title>
  <link rel="stylesheet" href="../assets/estilo.css">
  <style>
    /* Vista de computadora: la página real va en un iframe con proporción de celular (ver assets/marco.js). */
    html, body { overflow: hidden; }
    body {
      height: 100dvh; display: flex; align-items: center; justify-content: center; gap: clamp(2rem, 6vw, 5rem);
      padding: 1.25rem 2rem;
    }
    .telefono {
      flex: none; position: relative;
      height: calc(100dvh - 2.5rem); aspect-ratio: 9 / 19.5; min-width: 340px;
      border: 11px solid #151515; border-radius: 3.2rem; background: #151515;
      box-shadow: 0 0 0 1px #3a3a3a, 0 30px 60px -20px rgba(0, 0, 0, 0.45);
    }
    .telefono iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 2.5rem; background: var(--bg); }
    .nota { max-width: 21rem; display: flex; flex-direction: column; gap: 1.1rem; }
    .nota .m-artista {
      font-family: var(--display); font-weight: 500; text-transform: lowercase;
      font-size: 2.6rem; line-height: 0.85; color: var(--tierra);
    }
    .nota h1 { font-family: var(--display); font-weight: 400; font-size: 2.2rem; line-height: 1; }
    .nota p { font-size: 1.15rem; line-height: 1.45; color: var(--texto); }
    .qr { display: flex; align-items: center; gap: 1rem; padding-top: 1.1rem; border-top: 1px solid var(--line); }
    .qr[hidden] { display: none; }
    .qr div { flex: none; width: 8.5rem; height: 8.5rem; background: #fff; padding: 0.4rem; border-radius: 6px; }
    .qr svg { display: block; width: 100%; height: 100%; }
    .qr p { font-size: 1.05rem; line-height: 1.4; color: var(--texto); }
    /* ventana casi cuadrada: sólo el teléfono */
    @media (max-aspect-ratio: 1 / 1) { .nota { display: none; } }
  </style>
</head>
<body>
  <div class="telefono">
    <iframe id="pantalla" title="Little Havana · Paisajes sonoros" allow="autoplay; fullscreen; screen-wake-lock"></iframe>
  </div>
  <aside class="nota">
    <span class="m-artista">Viviana Zargón</span>
    <h1>Little Havana<br>Paisajes sonoros</h1>
    <p>Esta obra está pensada para el celular. En la computadora se muestra dentro de una pantalla de teléfono, tal como la verá el público.</p>
    <p>Se recomienda usar auriculares.</p>
    <div class="qr" id="qr" hidden>
      <div id="qr-img"></div>
      <p>Para verla en el celular, apuntá la cámara del teléfono a este código.</p>
    </div>
  </aside>

  <script>
    // destino: la página que se abrió (viene en el hash). Sólo rutas de este mismo sitio.
    const frame = document.getElementById('pantalla');
    let destino = '/';
    try {
      const u = new URL(decodeURIComponent(location.hash.slice(1)) || '/', location.origin);
      if (u.origin === location.origin && !u.pathname.startsWith('/marco')) destino = u.pathname + u.search + u.hash;
    } catch (e) {}
    frame.src = destino;
    // la barra de direcciones muestra la página real: al recargar o compartir el enlace se abre esa página
    history.replaceState(null, '', destino);

    function sincronizar() {
      try {
        const l = frame.contentWindow.location;
        if (l.origin !== location.origin) return;
        history.replaceState(null, '', l.pathname + l.search + l.hash);
        document.title = frame.contentDocument.title || document.title;
        dibujarQR(location.href);
      } catch (e) {}
    }
    frame.addEventListener('load', () => {
      sincronizar();
      try { frame.contentWindow.addEventListener('hashchange', sincronizar); } catch (e) {}
    });

    // QR de la página actual (si la biblioteca no carga, simplemente no aparece)
    function dibujarQR(url) {
      if (typeof qrcode !== 'function') return;
      const q = qrcode(0, 'M');
      q.addData(url);
      q.make();
      document.getElementById('qr-img').innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      document.getElementById('qr').hidden = false;
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" onload="dibujarQR(location.href)"></script>
</body>
</html>
