<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaeaea">
  <title>Calle Ocho Walk · Little Havana</title>
  <script src="../assets/marco.js"></script>
  <script>
    // si se abrió como /deriva-3d (sin barra final), las rutas relativas fallan: corregir la URL
    if (!location.pathname.endsWith('/') && !/\.html?$/.test(location.pathname))
      location.replace(location.pathname + '/' + location.search + location.hash);
  </script>
  <link rel="preload" as="image" href="../portada/panoramica.webp">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="../assets/estilo.css">
  <link rel="stylesheet" href="mapa.css">
</head>
<body>
  <div id="mapa" aria-label="3D map of the walk"></div>
  <!-- la panorámica fija mientras carga el 3D; mapa.js la ubica donde la va a proyectar la ciudad -->
  <img class="pano-foto" id="pano-foto" src="../portada/panoramica.webp" alt="" aria-hidden="true">
  <div class="vineta" aria-hidden="true"></div>

  <!-- pantalla de inicio: la interacción habilita el audio -->
  <section class="inicio" id="inicio">
    <header class="muestra" id="muestra"></header>
    <div class="sitio">
      <h2 class="nombre">Calle Ocho Walk</h2>
      <p class="lugar">From 13th to 17th Avenue along one sidewalk, back along the other to 15th</p>
    </div>
    <!-- mientras carga, la línea del recorrido con el caminante avanzando; cuando está todo listo (y fluido), Start -->
    <div class="arranque">
      <div class="carga" id="carga" role="progressbar" aria-label="Loading the walk" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="carga-linea"><span class="carga-hecho" id="carga-hecho"></span><span class="carga-punto" id="carga-punto"></span></div>
        <div class="carga-calles" aria-hidden="true"><span>13th Ave</span><span>17th Ave</span></div>
        <p class="carga-texto"><span id="carga-etapa">Loading the map</span><span class="carga-pct" id="carga-pct">0%</span></p>
      </div>
      <button class="comenzar" id="comenzar" disabled tabindex="-1">Start</button>
    </div>
    <p class="aviso">Headphones recommended.</p>
  </section>

  <!-- nota de esquina: los momentos que marcó la artista y los descriptores del audio (sigue con la interfaz oculta) -->
  <div class="estado" id="estado" aria-live="polite">
    <span class="nota" id="nota"></span>
  </div>

  <!-- pie del registro que se está mirando -->
  <div class="pie" id="pie" aria-live="polite">
    <b id="pie-lugar"></b><span id="pie-tipo"></span><span id="pie-n"></span>
  </div>

  <div class="fin" id="fin">
    <p>end of the walk</p>
    <button class="reiniciar" id="reiniciar" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
      start again
    </button>
  </div>

  <button class="seguir" id="seguir" hidden>Follow the walk</button>

  <!-- controles -->
  <section class="panel" id="panel" hidden>
    <!-- la línea es el recorrido: el punto avanza con el audio y se puede arrastrar -->
    <div class="linea">
      <input id="rango" type="range" min="0" max="1000" step="1" value="0" aria-label="Position along the walk">
    </div>
    <div class="fila">
      <button class="paso" id="anterior" aria-label="Previous point of interest">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>previous
      </button>
      <button class="pausa" id="pausa" aria-label="Pause">
        <svg class="i-pausa" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="paso" id="siguiente" aria-label="Next point of interest">
        next<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z"/></svg>
      </button>
    </div>
  </section>

  <!-- modo edición (?editar) -->
  <aside class="editor" id="editor" hidden>
    <div class="editor-cab"><b>Modo edición</b> · clic en el mapa = punto en el momento actual
      <button id="copiar">Copiar</button><button id="borrar">Borrar</button></div>
    <pre id="lista-puntos"></pre>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="../assets/sitios.js"></script>
  <script src="recorrido.js"></script>
  <script src="calibracion.js"></script>
  <script src="paredes-video.js"></script>
  <script type="module" src="mapa.js"></script>
</body>
</html>
