<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaeaea">
  <title>Deriva Calle 8 · Little Havana</title>
  <script src="../assets/marco.js"></script>
  <script>
    // si se abrió como /deriva-3d (sin barra final), las rutas relativas fallan: corregir la URL
    if (!location.pathname.endsWith('/') && !/\.html?$/.test(location.pathname))
      location.replace(location.pathname + '/' + location.search + location.hash);
  </script>
  <link rel="preload" as="image" href="../portada/panoramica.webp">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="../assets/estilo.css">
  <link rel="stylesheet" href="mapa.css">
</head>
<body>
  <div id="mapa" aria-label="Mapa 3D del recorrido"></div>
  <!-- la panorámica fija mientras carga el 3D; mapa.js la ubica donde la va a proyectar la ciudad -->
  <img class="pano-foto" id="pano-foto" src="../portada/panoramica.webp" alt="" aria-hidden="true">
  <div class="vineta" aria-hidden="true"></div>

  <!-- pantalla de inicio: la interacción habilita el audio -->
  <section class="inicio" id="inicio">
    <div class="sitio">
      <h1 class="nombre">Deriva Calle 8</h1>
      <p class="lugar">De 13 a 17 Avenida por una vereda, volviendo por la otra hasta la 15</p>
    </div>
    <footer class="muestra" id="muestra"></footer>
    <button class="comenzar" id="comenzar" disabled>Cargando mapa…</button>
    <p class="aviso">Se recomienda usar auriculares.</p>
  </section>

  <!-- indicador de pausa-escucha-registro y de esquina -->
  <div class="estado" id="estado" aria-live="polite">
    <span class="pausa-txt">pausa · escucha · registro</span>
    <span class="nota" id="nota"></span>
  </div>

  <!-- pie del registro que se está mirando -->
  <div class="pie" id="pie" aria-live="polite">
    <b id="pie-lugar"></b><span id="pie-tipo"></span><span id="pie-n"></span>
  </div>

  <div class="fin" id="fin">
    <p>fin del recorrido</p>
    <button class="reiniciar" id="reiniciar" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
      volver a empezar
    </button>
  </div>

  <button class="seguir" id="seguir" hidden>Seguir recorrido</button>

  <!-- controles -->
  <section class="panel" id="panel" hidden>
    <div class="linea">
      <div class="marcas" id="marcas" aria-hidden="true"></div>
      <input id="rango" type="range" min="0" max="1000" step="1" value="0" aria-label="Posición en el audio y el recorrido">
    </div>
    <div class="fila">
      <span class="tiempo" id="actual">0:00</span>
      <div class="botones">
        <button class="chico" id="atras" aria-label="Retroceder 15 segundos">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.2" text-anchor="middle">15</text></svg>
        </button>
        <button class="grande" id="play" aria-pressed="false" aria-label="Reproducir">
          <svg class="play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>
          <svg class="pausa" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="chico" id="adelante" aria-label="Adelantar 15 segundos">
          <svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.2" text-anchor="middle">15</text></svg>
        </button>
      </div>
      <span class="tiempo" id="total">–:––</span>
    </div>
    <div class="fila sec">
      <button class="texto-btn" id="anterior" aria-label="Punto anterior">‹ anterior</button>
      <button class="texto-btn" id="siguiente" aria-label="Punto siguiente">siguiente ›</button>
    </div>
    <p class="creditos" id="creditos"></p>
  </section>

  <!-- modo edición (?editar) -->
  <aside class="editor" id="editor" hidden>
    <div class="editor-cab"><b>Modo edición</b> · clic en el mapa = punto en el momento actual
      <button id="copiar">Copiar</button><button id="borrar">Borrar</button></div>
    <pre id="lista-puntos"></pre>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="../assets/sitios.js"></script>
  <script src="recorrido.js"></script>
  <script src="calibracion.js"></script>
  <script type="module" src="mapa.js"></script>
</body>
</html>
